name: Test FlowPulse

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb 2>/dev/null || true
          python -m pip install --upgrade pip
          pip install pyautogui pynput pystray Pillow
          pip install pywin32 2>/dev/null || true

      - name: Run unit tests
        run: xvfb-run python -m unittest tests.test_all -v

      - name: Smoke test (logic components)
        run: xvfb-run python smoke_test.py
